<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phishing Detector</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      min-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }

    .container {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h1 {
      font-size: 20px;
      margin-bottom: 15px;
      color: #667eea;
      text-align: center;
    }

    .api-key-section {
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 5px;
      color: #555;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-bottom: 10px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .secondary-btn {
      background: #f5f5f5;
      color: #333;
    }

    .secondary-btn:hover {
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    #status {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 13px;
      display: none;
    }

    #status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    #status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    #status.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    #results {
      margin-top: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 6px;
      display: none;
    }

    .result-item {
      margin-bottom: 10px;
      font-size: 13px;
    }

    .result-label {
      font-weight: 600;
      color: #555;
    }

    .threat-level {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 10px;
    }

    .threat-safe {
      background: #d4edda;
      color: #155724;
    }

    .threat-warning {
      background: #fff3cd;
      color: #856404;
    }

    .threat-danger {
      background: #f8d7da;
      color: #721c24;
    }

    .loader {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
      display: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .link {
      color: #667eea;
      text-decoration: none;
      font-size: 12px;
      text-align: center;
      display: block;
      margin-top: 10px;
    }

    .link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛡️ Phishing Detector</h1>
    
    <div class="api-key-section" id="apiKeySection">
      <div class="input-group">
        <label for="apiKey">VirusTotal API Key:</label>
        <input type="password" id="apiKey" placeholder="Enter your API key">
      </div>
      <button id="saveApiKey">Save API Key</button>
      <a href="https://www.virustotal.com/gui/my-apikey" target="_blank" class="link">Get API Key</a>
    </div>

    <div class="input-group">
      <label for="urlInput">URL to Scan:</label>
      <input type="text" id="urlInput" placeholder="https://example.com">
    </div>

    <button id="scanBtn">🔍 Scan URL</button>
    <button id="scanCurrentBtn" class="secondary-btn">📋 Scan Current Tab</button>
    <button id="exportBtn" class="secondary-btn" style="display:none;">💾 Export to CSV</button>

    <div class="loader" id="loader"></div>
    <div id="status"></div>
    <div id="results"></div>
  </div>


  <script src="dist/popup.js" type="module"></script>
</body>
</html>
