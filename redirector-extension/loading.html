<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛡️ Scanning Redirect...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #2d5016 0%, #5cb85c 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      padding: 60px 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .icon {
      font-size: 80px;
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }

    h1 {
      color: #2d5016;
      font-size: 28px;
      margin-bottom: 16px;
      font-weight: 700;
    }

    .message {
      color: #495057;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .spinner {
      border: 4px solid #e8f5e8;
      border-top: 4px solid #5cb85c;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin: 0 auto 24px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .url-display {
      background: #f8fff8;
      padding: 16px;
      border-radius: 8px;
      margin: 24px 0;
      word-break: break-all;
      font-family: monospace;
      font-size: 13px;
      color: #2d5016;
      border-left: 4px solid #5cb85c;
    }

    .status-text {
      color: #6c757d;
      font-size: 14px;
      font-style: italic;
      margin-bottom: 20px;
    }

    .progress-dots {
      display: inline-block;
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60% { content: '...'; }
      80%, 100% { content: ''; }
    }

    .progress-dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }

    .protection-info {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
      padding: 16px;
      border-radius: 8px;
      margin-top: 24px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .redirect-info {
      background: #e2e3e5;
      padding: 12px;
      border-radius: 6px;
      margin: 16px 0;
      font-size: 12px;
      color: #495057;
      border-left: 3px solid #6c757d;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🛡️</div>
    <h1>Security Check in Progress</h1>
    
    <div class="message">
      We detected a redirect and are verifying its safety.
      This will only take a few seconds.
    </div>

    <div class="spinner"></div>

    <div class="redirect-info" id="redirectInfo" style="display: none;">
      <strong>Redirect detected:</strong><br>
      <span id="redirectFrom">Unknown</span> → <span id="redirectTo">Unknown</span>
    </div>

    <div class="url-display" id="urlDisplay">Loading...</div>

    <div class="status-text">
      Analyzing redirect safety<span class="progress-dots"></span>
    </div>

    <div class="protection-info">
      <span>🔍</span>
      <span>Checking URL against security databases and threat intelligence</span>
    </div>
  </div>

  <script>
    // Parse URL parameters
    const params = new URLSearchParams(window.location.search);
    const scannedUrl = params.get('url') || 'Unknown URL';
    const originalUrl = params.get('from');

    // Display the URL being scanned
    document.getElementById('urlDisplay').textContent = scannedUrl;

    // Show redirect information if available
    if (originalUrl && originalUrl !== scannedUrl) {
      const redirectInfo = document.getElementById('redirectInfo');
      const redirectFrom = document.getElementById('redirectFrom');
      const redirectTo = document.getElementById('redirectTo');
      
      redirectFrom.textContent = originalUrl;
      redirectTo.textContent = scannedUrl;
      redirectInfo.style.display = 'block';
    }

    // Add some dynamic status updates for better user experience
    const statusMessages = [
      "Analyzing redirect safety",
      "Checking security databases",
      "Verifying domain reputation", 
      "Scanning for threats",
      "Finalizing security assessment"
    ];

    let messageIndex = 0;
    const statusText = document.querySelector('.status-text');
    
    setInterval(() => {
      messageIndex = (messageIndex + 1) % statusMessages.length;
      statusText.innerHTML = statusMessages[messageIndex] + '<span class="progress-dots"></span>';
    }, 2000);
  </script>
</body>
</html>
